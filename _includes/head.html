{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  /* Theme provider to avoid flashing */
  (function() {
    var themeSetting = localStorage.getItem("theme") || "system";
    var html = document.documentElement;
    html.setAttribute("data-theme-setting", themeSetting);

    if (themeSetting === "dark") {
      html.setAttribute("data-theme", "dark");
    } else if (themeSetting === "light") {
      html.removeAttribute("data-theme");
    }

    html.classList.add("preload");
    html.className = html.className.replace(/\bno-js\b/g, '') + ' js ';
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
