name: Generate Photography Thumbnails

on:
  push:
    paths:
      - 'images/photography/*.jpg'
      - 'images/photography/*.jpeg'
      - 'images/photography/*.png'
      - 'images/photography/*.JPG'
      - 'images/photography/*.JPEG'
      - 'images/photography/*.PNG'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick 7
        run: |
          curl -fsSL "https://release-assets.githubusercontent.com/github-production-release-asset/35780977/4a821e43-5ac3-4be1-a323-955bba497b2c" -o /tmp/magick.AppImage
          chmod +x /tmp/magick.AppImage
          sudo ln -s /tmp/magick.AppImage /usr/local/bin/magick

      - name: Generate thumbnails
        run: |
          chmod +x scripts/generate_thumbs.sh
          scripts/generate_thumbs.sh

      - name: Commit generated thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/photography/thumbs
          git commit -m "Generate photography thumbnails" || echo "No changes to commit"
          git push